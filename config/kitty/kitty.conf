# kitty.conf — configuración de Kitty para uso diario en Kubuntu 24.04
#
# Enlazado a ~/.config/kitty/kitty.conf por `make kitty` (ver Makefile).
# El binario de kitty se instala aparte, de forma opt-in, desde
# `scripts/install_from_source.sh` (bloque interactivo, mismo patrón que FNM).
# Konsole se mantiene instalada — no es un reemplazo, es una alternativa.

# ============================================
# Seguridad
# ============================================
# clipboard_control: por defecto kitty permite ESCRIBIR en el portapapeles
# del sistema y en la selección primaria SIN confirmación desde cualquier
# programa que corra dentro de la terminal — incluido uno remoto por SSH —
# y solo pide confirmación para LEER (verificado contra la documentación
# oficial de kitty: https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.clipboard_control,
# acciones posibles: write-clipboard, read-clipboard, write-primary,
# read-primary, read-clipboard-ask, read-primary-ask — no existe una acción
# "write-*-ask"). Aquí se omiten las dos acciones de escritura por completo
# (write-clipboard/write-primary ausentes de la lista de abajo desactiva la
# escritura vía OSC 52), y se mantiene la lectura con confirmación
# explícita. Esto NO afecta a copiar/pegar con el ratón o los atajos
# propios de kitty (Ctrl+Shift+C/V) — solo a los escapes OSC 52 que emite
# un programa que corre DENTRO de la terminal.
# COSTE, para que la decisión sea consciente: los escritores LEGÍTIMOS de
# OSC 52 dejan de copiar en silencio, sin prompt ni error — típicamente
# `tmux set-clipboard on` y un nvim/vim usado por SSH que copie al
# portapapeles local. Si algún día echas eso de menos, la solución es
# añadir write-clipboard aquí, no buscar el fallo en el programa remoto.
clipboard_control read-clipboard-ask read-primary-ask

# update_check_interval: el binario lo gestiona el instalador de este repo
# (scripts/install_from_source.sh) — la comprobación automática de
# actualizaciones de kitty solo añade una llamada periódica a la
# infraestructura de kitty.org sin aportar nada útil aquí. 0 la desactiva.
update_check_interval 0

# allow_hyperlinks: declarado explícito en su valor por defecto (yes) en
# vez de dejarlo implícito. Un hipervínculo OSC 8 exige un clic explícito
# del usuario para activarse — no ejecuta nada por sí solo — así que se
# mantiene el default; queda documentado como decisión revisada, no como
# omisión silenciosa.
allow_hyperlinks yes

# ============================================
# Fuente
# ============================================
# JetBrains Mono Nerd Font Mono — instalada por `make fonts`
# (scripts/install_fonts.sh), que extrae los ficheros
# JetBrainsMonoNerdFontMono-{Regular,Bold,Italic,BoldItalic}.ttf. La familia
# fontconfig resultante es "JetBrainsMono Nerd Font Mono" (nombre derivado
# del propio fichero .ttf instalado, no de un catálogo aparte).
#
# Si `make fonts` no se ha ejecutado todavía, kitty no encontrará esta
# familia y caerá a su propio fallback — ejecuta `make fonts` antes de
# `make kitty` para evitar tofu/cuadrados en el prompt y en los iconos.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# ============================================
# symbol_map — glifos de Nerd Font
# ============================================
# El usuario venía viendo cuadrados en Konsole por depender del fallback de
# fontconfig para resolver los glifos de Nerd Font (iconos, powerline, etc.)
# cuando la fuente principal no los declara en su propia tabla de glifos.
# symbol_map fuerza esos rangos del Private Use Area a la MISMA familia
# declarada arriba, sin depender de ningún fallback — resultado determinista.
#
# Rangos publicados por el proyecto Nerd Fonts (Private Use Area allocation,
# https://github.com/ryanoasis/nerd-fonts/wiki/Glyph-Sets-and-Code-Points):
# Pomicons, Powerline (+ extra symbols), Font Awesome Extension, Weather
# Icons, Seti-UI + Custom, Devicons, Font Awesome (clásico + símbolos
# extendidos), Octicons, Material Design Icons y Codicons.
# Powerline extra symbols ampliado a U+e0d7 (antes U+e0d4) — Nerd Fonts
# v3.x (versión pinneada en scripts/install_fonts.sh) publica ese bloque
# hasta U+e0d7; dejarlo en U+e0d4 excluía U+e0d5-U+e0d7 del mapeo forzado.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a3,U+e0b0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3eb,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+f2ff,U+f400-U+f4ff,U+ea60-U+ec1e,U+f0001-U+f1af0 JetBrainsMono Nerd Font Mono

# ============================================
# Tema — Tokyo Night
# ============================================
# Deriva del mismo esquema que ya usa FZF_DEFAULT_OPTS en
# shell/exports.sh:60 (bg #1a1b26, fg #c0caf5, hl #bb9af7, bg+ #283457,
# hl+ #7dcfff, info #7aa2f7, pointer #bb9af7, marker #9ece6a) para que
# terminal y fzf compartan paleta. Los colores ANSI que shell/exports.sh no
# fija (verde/amarillo/blanco base, y los "brights") se completan con la
# paleta pública de Tokyo Night ("Night" variant) — cuya coincidencia con
# los 6 tonos ya citados de shell/exports.sh confirma que es el mismo
# esquema de origen.
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457
cursor                  #bb9af7
cursor_text_color       #1a1b26
url_color               #7aa2f7

active_border_color     #7aa2f7
inactive_border_color   #414868
bell_border_color       #f7768e

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green — coincide con FZF marker (shell/exports.sh:60)
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue — coincide con FZF info (shell/exports.sh:60)
color4  #7aa2f7
color12 #7aa2f7
# magenta — coincide con FZF hl/pointer (shell/exports.sh:60)
color5  #bb9af7
color13 #bb9af7
# cyan — coincide con FZF hl+ (shell/exports.sh:60)
color6  #7dcfff
color14 #7dcfff
# white
color7  #a9b1d6
color15 #c0caf5

# ============================================
# Scrollback y comportamiento
# ============================================
scrollback_lines      20000
enable_audio_bell     no
visual_bell_duration  0.0

# confirm_os_window_close: nº mínimo de VENTANAS kitty (cada pestaña
# contiene al menos una; los splits añaden más) abiertas en la misma
# ventana del SO para pedir confirmación al cerrarla — el mismo umbral
# gobierna también `quit` (salir de la aplicación entera) y `close_tab`,
# que aquí está mapeada a ctrl+shift+q. Con 2, cerrar una ventana del SO
# que solo tiene UNA pestaña/panel no pregunta, pero cerrar una con varias
# pestañas/splits sí — evita perder trabajo por accidente sin ser
# intrusivo en el caso de un solo panel.
confirm_os_window_close 2

# ============================================
# Pestañas
# ============================================
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style slanted
tab_bar_min_tabs  1

map ctrl+shift+t      new_tab
map ctrl+shift+q      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+1      goto_tab 1
map ctrl+shift+2      goto_tab 2
map ctrl+shift+3      goto_tab 3
map ctrl+shift+4      goto_tab 4
map ctrl+shift+5      goto_tab 5

# ============================================
# Divisiones (splits)
# ============================================
enabled_layouts splits,stack,tall

# ctrl+shift+enter crea split según el eje implícito del layout activo;
# con `enabled_layouts splits` no hay forma de elegir el eje desde ese
# atajo — se añaden abajo bindings explícitos horizontal/vertical vía
# `launch --location=`. Verificado contra los defaults documentados por
# kitty (kitty.conf docs oficiales): ctrl+shift+d no tiene binding por
# defecto (queda libre); ctrl+shift+s sustituye `paste_from_selection`
# (Shift+Insert sigue disponible como alternativa).
map ctrl+shift+enter  new_window
map ctrl+shift+d      launch --location=vsplit --cwd=current
map ctrl+shift+s      launch --location=hsplit --cwd=current
map ctrl+shift+w      close_window
# next_window/previous_window: ctrl+shift+]/[ exigen AltGr en teclado
# español (el del usuario, ver shell/exports.sh:23 es_ES.UTF-8) — se usan
# arriba/abajo en su lugar, alcanzables sin modificador extra. Sustituyen
# los defaults de kitty scroll_line_up/down para ctrl+shift+up/down
# (verificado contra los defaults documentados por kitty); el binding
# alternativo ctrl+shift+k/j para el mismo scroll sigue intacto.
map ctrl+shift+down   next_window
map ctrl+shift+up     previous_window
map ctrl+shift+f      move_window_forward
map ctrl+shift+b      move_window_backward
